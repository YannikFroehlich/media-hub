appId: com.solarlux.mediahub
productName: Media Hub
directories:
  output: release
files:
  - electron/**/*
  - scripts/windows/server.mjs
  - package.json
extraResources:
  - from: dist/media-hub/browser
    to: app
asar: true
publish:
  - provider: github
    owner: YannikFroehlich
    repo: media-hub
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/favicon.png
nsis:
  artifactName: 'Media-Hub-${version}-setup.${ext}'
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: 'Media-Hub-${version}-portable.${ext}'
  requestExecutionLevel: user
