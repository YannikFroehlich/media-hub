appId: de.yannikfroehlich.mediahub
productName: Media Hub
directories:
  output: release
files:
  - electron/**/*
  - scripts/windows/server.mjs
  - package.json
extraResources:
  - from: dist/media-hub/browser
    to: app
asar: true
publish:
  - provider: github
    owner: YannikFroehlich
    repo: media-hub
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/favicon.png
nsis:
  # Derived from the previous appId (com.solarlux.mediahub). Keep it pinned so existing
  # installs upgrade in place instead of getting a second side-by-side install.
  guid: 712094fa-2206-5c58-a969-afa4837d0fb1
  artifactName: 'Media-Hub-${version}-setup.${ext}'
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: 'Media-Hub-${version}-portable.${ext}'
  requestExecutionLevel: user
