name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: media-hub-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, and release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

      - name: Set build version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use the format major.minor.patch."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          npm version $version --no-git-tag-version

      - name: Build Windows packages
        run: npm run electron:pack

      - name: Smoke-test packaged application
        run: npm run electron:smoke
        timeout-minutes: 2

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: media-hub-windows-${{ steps.version.outputs.version }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Media Hub ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
